<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Menu</title>
    <link rel="stylesheet" href="/CSS/TM.css">
</head>

<body>

    <div class="tabs">

        <!-- Radios -->
        <input type="radio" name="tab" id="tab1" checked>
        <input type="radio" name="tab" id="tab2">
        <input type="radio" name="tab" id="tab3">

        <!-- Labels -->
        <div class="tab-labels">
            <label for="tab1">HTML</label>
            <label for="tab2">React</label>
            <label for="tab3">Vue</label>
        </div>

        <!-- Conteúdo -->
        <div class="content">
            <div class="tab-content" id="content1">
                <h2>HTML</h2>
                <p>HTML é a linguagem de marcação usada para estruturar páginas web.</p>
            </div>

            <div class="tab-content" id="content2">
                <h2>React</h2>
                <p>React é uma biblioteca JavaScript para construção de interfaces de usuário.</p>
            </div>

            <div class="tab-content" id="content3">
                <h2>Vue</h2>
                <p>Vue é um framework progressivo para construção de interfaces modernas.</p>
            </div>
        </div>

    </div>

</body>

</html>
